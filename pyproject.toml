[project]
name = "mcpsec-scan"
version = "0.1.0"
description = "Static security scanner for MCP servers and AI agent skills."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
mcpsec = "mcpsec.cli:main"

[project.optional-dependencies]
semantic = [
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcpsec"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
