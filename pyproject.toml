[project]
name = "mcp-skill-scanner"
version = "0.2.0"
description = "Static security scanner for MCP servers and AI agent skills."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
mcpsec = "mcpsec.cli:main"

[project.optional-dependencies]
semantic = [
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
]
# LLM triage (ADR-0011): LangGraph orchestration + Langfuse tracing.
agent = [
    "langgraph>=1.2,<2",
    "langfuse>=5.1,<6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcpsec"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py313"
# Fixtures are deliberately vulnerable or partial code: their line/column
# positions are asserted by tests, so they are never reformatted or linted.
extend-exclude = ["tests/fixtures"]
